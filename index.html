<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/sitelogo/vs-logo.png" />
    <link rel="apple-touch-icon" href="/sitelogo/vs-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Versus Arena</title>
    <meta name="description" content="Pick any two fictional characters and get an AI verdict on who wins, with full reasoning and a dominance tier. Settle the debate. No bias. No favorites" />
    <style>
      /* The boot fallback below is HIDDEN on a normal open/reload: React clears
         #root the instant it mounts (well under a second), so this never appears.
         It only fades in if the bundle genuinely hasn't booted after 5s -- i.e.
         a real stall or a failed bundle -- so it never steps on the splash's
         loading-bar animation. Pure CSS so it still works before/without the JS
         bundle. */
      @keyframes bootFallbackIn { to { opacity: 1; } }
      .boot-fallback { opacity: 0; animation: bootFallbackIn 0.5s ease 5s forwards; }
      @media (prefers-reduced-motion: reduce) {
        .boot-fallback { animation-duration: 0.01ms; } /* keep the 5s delay, drop the fade */
      }
    </style>
  </head>
  <body>
    <!-- Fallback shown only if the app bundle stalls/fails to boot, or JS is off.
         React clears #root on mount, so this lingers only when nothing booted.
         Background matches the black splash so a normal open/reload shows nothing. -->
    <div id="root">
      <div style="min-height:100vh;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;font-family:Georgia,serif;">
        <div class="boot-fallback">
          <div style="letter-spacing:0.35em;text-transform:uppercase;color:#B8860B;font-size:0.8rem;margin-bottom:1rem;">Versus Arena</div>
          <h1 style="color:#F5F2EC;font-size:1.6rem;margin:0 0 0.75rem;">Loading the Arena...</h1>
          <p style="color:#8A8479;max-width:26rem;line-height:1.6;">
            If this screen doesn't clear in a few seconds, please refresh the page.
          </p>
        </div>
        <noscript>
          <div style="letter-spacing:0.35em;text-transform:uppercase;color:#B8860B;font-size:0.8rem;margin-bottom:1rem;">Versus Arena</div>
          <p style="color:#F5F2EC;max-width:26rem;line-height:1.6;">This site needs JavaScript enabled to run.</p>
        </noscript>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
